# 蘭獸網站後台設定（Pages CMS）
# 這個檔案決定後台出現哪些項目、每個項目有哪些欄位。一般內容更新不需要改這個檔案。

media:
  input: images
  output: /images
  categories: [image]
  label: 網站照片

content:
  - name: origin
    label: 01 起源傳說
    type: file
    path: content/origin.json
    format: json
    list: true
    fields:
      - name: title
        label: 標題
        type: object
        fields:
          - { name: zh, label: 中文, type: string }
          - { name: en, label: English, type: string }
          - { name: ja, label: 日本語, type: string }
      - name: summary
        label: 卡片摘要（一句話）
        type: object
        fields:
          - { name: zh, label: 中文, type: text }
          - { name: en, label: English, type: text }
          - { name: ja, label: 日本語, type: text }
      - name: body
        label: 內文（### 小標、- 清單、**粗體**、空一行分段）
        type: object
        fields:
          - { name: zh, label: 中文, type: text }
          - { name: en, label: English, type: text }
          - { name: ja, label: 日本語, type: text }
      - name: photos
        label: 照片（第一張是封面）
        type: object
        list: true
        fields:
          - { name: src, label: 照片, type: image, required: true }
          - name: caption
            label: 圖說
            type: object
            fields:
              - { name: zh, label: 中文, type: string }
              - { name: en, label: English, type: string }
              - { name: ja, label: 日本語, type: string }
          - { name: focus, label: 封面對焦位置（進階，可留空）, type: string }
          - { name: ai, label: AI 生成圖（打勾後，圖片右下角會自動顯示「AI 生成示意圖」）, type: boolean }

  - name: personality
    label: 02 天賦鑑定（心理測驗）
    type: file
    path: content/personality.json
    format: json
    fields:
      - name: questions
        label: 題目（共 12 題；每題 4 個選項，作答時會自動打亂順序）
        type: object
        list: true
        fields:
          - name: q
            label: 題目
            type: object
            fields:
              - { name: zh, label: 中文, type: string }
              - { name: en, label: English, type: string }
              - { name: ja, label: 日本語, type: string }
          - name: options
            label: 選項
            type: object
            list: true
            fields:
              - name: type
                label: 計分類型（填類型代號：附著、吸收、適應、探索、平衡、連結、守護、再生）
                type: string
              - name: text
                label: 選項文字
                type: object
                fields:
                  - { name: zh, label: 中文, type: string }
                  - { name: en, label: English, type: string }
                  - { name: ja, label: 日本語, type: string }
      - name: types
        label: 8 種結果類型
        type: object
        list: true
        fields:
          - { name: key, label: 類型代號（題目計分用，請勿修改）, type: string }
          - name: name
            label: 類型名稱
            type: object
            fields:
              - { name: zh, label: 中文, type: string }
              - { name: en, label: English, type: string }
              - { name: ja, label: 日本語, type: string }
          - name: title
            label: 稱號
            type: object
            fields:
              - { name: zh, label: 中文, type: string }
              - { name: en, label: English, type: string }
              - { name: ja, label: 日本語, type: string }
          - name: motto
            label: 一句話宣言
            type: object
            fields:
              - { name: zh, label: 中文, type: text }
              - { name: en, label: English, type: text }
              - { name: ja, label: 日本語, type: text }
          - name: desc
            label: 說明
            type: object
            fields:
              - { name: zh, label: 中文, type: text }
              - { name: en, label: English, type: text }
              - { name: ja, label: 日本語, type: text }
          - name: skills
            label: 天賦技能（星等 1～5）
            type: object
            list: true
            fields:
              - name: name
                label: 技能名稱
                type: object
                fields:
                  - { name: zh, label: 中文, type: string }
                  - { name: en, label: English, type: string }
                  - { name: ja, label: 日本語, type: string }
              - { name: stars, label: 星等（1～5）, type: number }
          - { name: partner, label: 最佳共生夥伴（填類型代號）, type: string }
          - name: partnerText
            label: 共生夥伴說明
            type: object
            fields:
              - { name: zh, label: 中文, type: text }
              - { name: en, label: English, type: text }
              - { name: ja, label: 日本語, type: text }
          - { name: color, label: 代表色（進階，例：#a07a52）, type: string }
          - { name: icon, label: 代表圖示（表情符號）, type: string }

  - name: journey
    label: 03 冒險足跡
    type: file
    path: content/journey.json
    format: json
    list: true
    fields:
      - name: title
        label: 標題
        type: object
        fields:
          - { name: zh, label: 中文, type: string }
          - { name: en, label: English, type: string }
          - { name: ja, label: 日本語, type: string }
      - name: date
        label: 日期（例：2026.09，顯示在卡片左上角）
        type: string
      - name: summary
        label: 卡片摘要（一句話）
        type: object
        fields:
          - { name: zh, label: 中文, type: text }
          - { name: en, label: English, type: text }
          - { name: ja, label: 日本語, type: text }
      - name: body
        label: 內文（### 小標、- 清單、**粗體**、空一行分段）
        type: object
        fields:
          - { name: zh, label: 中文, type: text }
          - { name: en, label: English, type: text }
          - { name: ja, label: 日本語, type: text }
      - name: lat
        label: 地圖緯度（沒有地點就留空）
        type: number
      - name: lng
        label: 地圖經度（沒有地點就留空）
        type: number
      - name: photos
        label: 照片（第一張是封面）
        type: object
        list: true
        fields:
          - { name: src, label: 照片, type: image, required: true }
          - name: caption
            label: 圖說
            type: object
            fields:
              - { name: zh, label: 中文, type: string }
              - { name: en, label: English, type: string }
              - { name: ja, label: 日本語, type: string }
          - { name: focus, label: 封面對焦位置（進階，例：50% 20%，可留空）, type: string }

  - name: science
    label: 04 生態圖鑑
    type: file
    path: content/science.json
    format: json
    list: true
    fields:
      - name: title
        label: 標題
        type: object
        fields:
          - { name: zh, label: 中文, type: string }
          - { name: en, label: English, type: string }
          - { name: ja, label: 日本語, type: string }
      - name: summary
        label: 卡片摘要（一句話）
        type: object
        fields:
          - { name: zh, label: 中文, type: text }
          - { name: en, label: English, type: text }
          - { name: ja, label: 日本語, type: text }
      - name: body
        label: 內文（### 小標、- 清單、**粗體**、空一行分段）
        type: object
        fields:
          - { name: zh, label: 中文, type: text }
          - { name: en, label: English, type: text }
          - { name: ja, label: 日本語, type: text }
      - name: photos
        label: 照片（第一張是封面）
        type: object
        list: true
        fields:
          - { name: src, label: 照片, type: image, required: true }
          - name: caption
            label: 圖說
            type: object
            fields:
              - { name: zh, label: 中文, type: string }
              - { name: en, label: English, type: string }
              - { name: ja, label: 日本語, type: string }
          - { name: focus, label: 封面對焦位置（進階，可留空）, type: string }
          - { name: ai, label: AI 生成圖（打勾後，圖片右下角會自動顯示「AI 生成示意圖」）, type: boolean }

  - name: quiz
    label: 06 蘭獸樂園－知識闖關題庫
    type: file
    path: content/quiz.json
    format: json
    list: true
    fields:
      - name: q
        label: 題目
        type: object
        fields:
          - { name: zh, label: 中文, type: string }
          - { name: en, label: English, type: string }
          - { name: ja, label: 日本語, type: string }
      - name: right
        label: 正確答案
        type: object
        fields:
          - { name: zh, label: 中文, type: string }
          - { name: en, label: English, type: string }
          - { name: ja, label: 日本語, type: string }
      - name: wrong
        label: 錯誤選項（放 3 個；遊戲會自動打亂順序）
        type: object
        list: true
        fields:
          - { name: zh, label: 中文, type: string }
          - { name: en, label: English, type: string }
          - { name: ja, label: 日本語, type: string }
