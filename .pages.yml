# 蘭獸網站後台設定（Pages CMS）
# 這個檔案決定後台出現哪些項目、每個項目有哪些欄位。一般內容更新不需要改這個檔案。

media:
  input: images
  output: /images
  categories: [image]
  label: 網站照片

content:
  - name: journey
    label: 02 巡迴展歷
    type: file
    path: content/journey.json
    format: json
    list: true
    fields:
      - name: title
        label: 標題
        type: object
        fields:
          - { name: zh, label: 中文, type: string }
          - { name: en, label: English, type: string }
          - { name: ja, label: 日本語, type: string }
      - name: date
        label: 日期（例：2026.09，顯示在卡片左上角）
        type: string
      - name: summary
        label: 卡片摘要（一句話）
        type: object
        fields:
          - { name: zh, label: 中文, type: text }
          - { name: en, label: English, type: text }
          - { name: ja, label: 日本語, type: text }
      - name: body
        label: 內文（### 小標、- 清單、**粗體**、空一行分段）
        type: object
        fields:
          - { name: zh, label: 中文, type: text }
          - { name: en, label: English, type: text }
          - { name: ja, label: 日本語, type: text }
      - name: lat
        label: 地圖緯度（沒有地點就留空）
        type: number
      - name: lng
        label: 地圖經度（沒有地點就留空）
        type: number
      - name: photos
        label: 照片（第一張是封面）
        type: object
        list: true
        fields:
          - { name: src, label: 照片, type: image, required: true }
          - name: caption
            label: 圖說
            type: object
            fields:
              - { name: zh, label: 中文, type: string }
              - { name: en, label: English, type: string }
              - { name: ja, label: 日本語, type: string }
          - { name: focus, label: 封面對焦位置（進階，例：50% 20%，可留空）, type: string }

  - name: origin
    label: 01 蘭獸起源
    type: file
    path: content/origin.json
    format: json
    list: true
    fields:
      - name: title
        label: 標題
        type: object
        fields:
          - { name: zh, label: 中文, type: string }
          - { name: en, label: English, type: string }
          - { name: ja, label: 日本語, type: string }
      - name: summary
        label: 卡片摘要（一句話）
        type: object
        fields:
          - { name: zh, label: 中文, type: text }
          - { name: en, label: English, type: text }
          - { name: ja, label: 日本語, type: text }
      - name: body
        label: 內文（### 小標、- 清單、**粗體**、空一行分段）
        type: object
        fields:
          - { name: zh, label: 中文, type: text }
          - { name: en, label: English, type: text }
          - { name: ja, label: 日本語, type: text }
      - name: photos
        label: 照片（第一張是封面）
        type: object
        list: true
        fields:
          - { name: src, label: 照片, type: image, required: true }
          - name: caption
            label: 圖說
            type: object
            fields:
              - { name: zh, label: 中文, type: string }
              - { name: en, label: English, type: string }
              - { name: ja, label: 日本語, type: string }
          - { name: focus, label: 封面對焦位置（進階，可留空）, type: string }

  - name: science
    label: 03 科學教室
    type: file
    path: content/science.json
    format: json
    list: true
    fields:
      - name: title
        label: 標題
        type: object
        fields:
          - { name: zh, label: 中文, type: string }
          - { name: en, label: English, type: string }
          - { name: ja, label: 日本語, type: string }
      - name: summary
        label: 卡片摘要（一句話）
        type: object
        fields:
          - { name: zh, label: 中文, type: text }
          - { name: en, label: English, type: text }
          - { name: ja, label: 日本語, type: text }
      - name: body
        label: 內文（### 小標、- 清單、**粗體**、空一行分段）
        type: object
        fields:
          - { name: zh, label: 中文, type: text }
          - { name: en, label: English, type: text }
          - { name: ja, label: 日本語, type: text }
      - name: photos
        label: 照片（第一張是封面）
        type: object
        list: true
        fields:
          - { name: src, label: 照片, type: image, required: true }
          - name: caption
            label: 圖說
            type: object
            fields:
              - { name: zh, label: 中文, type: string }
              - { name: en, label: English, type: string }
              - { name: ja, label: 日本語, type: string }
          - { name: focus, label: 封面對焦位置（進階，可留空）, type: string }

  - name: quiz
    label: 遊戲區－知識闖關題庫
    type: file
    path: content/quiz.json
    format: json
    list: true
    fields:
      - name: q
        label: 題目
        type: object
        fields:
          - { name: zh, label: 中文, type: string }
          - { name: en, label: English, type: string }
          - { name: ja, label: 日本語, type: string }
      - name: right
        label: 正確答案
        type: object
        fields:
          - { name: zh, label: 中文, type: string }
          - { name: en, label: English, type: string }
          - { name: ja, label: 日本語, type: string }
      - name: wrong
        label: 錯誤選項（放 3 個；遊戲會自動打亂順序）
        type: object
        list: true
        fields:
          - { name: zh, label: 中文, type: string }
          - { name: en, label: English, type: string }
          - { name: ja, label: 日本語, type: string }
